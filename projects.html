    <template id="project-tien-len-ai" data-meta="01 · 2025–present">
      <h3 id="panel-title">Tiến Lên AI</h3>
      <p class="sheet-hook">Four AI players at a Vietnamese card table.</p>
      <img class="sheet-img" src="assets/section-projects/preview/tien-len-ai.webp" alt="Neon playing cards fanned out over a circuit board" width="640" height="640" />
      <div class="strip">
        <p class="label">pipeline</p>
        <ol>
          <li data-kind="source">game state</li>
          <li data-kind="transform">minimax · α-β</li>
          <li data-kind="output">win-rate sim</li>
        </ol>
      </div>
      <dl class="writeup">
        <div><dt>Problem</dt><dd>Which strategy wins Tiến Lên most often?</dd></div>
        <div><dt>Approach</dt><dd>A playable web game where any seat can be human, random, greedy or minimax with alpha-beta pruning. A headless simulator plays hundreds of games to compare win rates.</dd></div>
        <div><dt>Result</dt><dd>Alpha-beta cuts the branches searched per turn by about 40%.</dd></div>
      </dl>
      <p class="sheet-links">
        <a class="btn btn-solid" href="https://tien-len-ai.vercel.app/">Play the demo</a>
        <a class="btn btn-outline" href="https://github.com/illydh/tien-len-ai">GitHub</a>
      </p>
    </template>

    <template id="project-ghostformer" data-meta="02 · 2024–2025 · NFL Big Data Bowl">
      <h3 id="panel-title">GhostFormer</h3>
      <p class="sheet-hook">Predicting a hidden NFL player's motion from the other 21.</p>
      <img class="sheet-img" src="assets/section-projects/preview/ghostformer.webp" alt="NFL Big Data Bowl logo" width="960" height="501" />
      <div class="strip">
        <p class="label">pipeline</p>
        <ol>
          <li data-kind="source">tracking CSVs</li>
          <li data-kind="transform">masked frames</li>
          <li data-kind="output">position grid</li>
        </ol>
      </div>
      <dl class="writeup">
        <div><dt>Problem</dt><dd>Given 21 players, where should the 22nd be before the snap?</dd></div>
        <div><dt>Approach</dt><dd>Hide one defender per sample. A spatial transformer reads each frame, a temporal one reads the hidden player's history, and a grid head picks a spot on a 120×60 field.</dd></div>
        <div><dt>Result</dt><dd>About 70% accuracy and F1 on position, with a 3-yard mean error.</dd></div>
      </dl>
      <p class="sheet-links">
        <a class="btn btn-outline" href="https://github.com/illydh/2025-nfl-bdb">GitHub</a>
      </p>
    </template>

    <template id="project-aq10" data-meta="03 · 2025 · UConn">
      <h3 id="panel-title">AQ-10 screening model</h3>
      <p class="sheet-hook">Predicting autism diagnosis from ten screening answers.</p>
      <img class="sheet-img" src="assets/section-projects/preview/aq10.webp" alt="AQ-10 title card with a cartoon owl" width="960" height="685" />
      <div class="strip">
        <p class="label">pipeline</p>
        <ol>
          <li data-kind="source">survey answers</li>
          <li data-kind="transform">transformer</li>
          <li data-kind="output">FastAPI service</li>
        </ol>
      </div>
      <dl class="writeup">
        <div><dt>Problem</dt><dd>A naive model scores 91.5% accuracy by calling everyone negative.</dd></div>
        <div><dt>Approach</dt><dd>A transformer over the AQ-10 answers plus age and gender, retrained for balance and served through FastAPI with a React front end.</dd></div>
        <div><dt>Result</dt><dd>ROC AUC 0.82 and PR AUC 0.77. Advised by Suining He, PhD.</dd></div>
      </dl>
      <p class="sheet-links">
        <a class="btn btn-outline" href="https://github.com/illydh/aq10-analysis/tree/main">GitHub</a>
        <a class="btn btn-outline" href="assets/section-projects/project-5-final-report.pdf" target="_blank" rel="noopener">Report (PDF)</a>
      </p>
    </template>
